# artifact probabilities and strengths
noise_prob: 0.3
noise_max_sigma: 10.0
salt_pepper_max_prob: 0.03

blur_prob: 0.3
blur_max_sigma: 3.0
motion_blur_max_size: 9

illumination_prob: 0.3

missing_prob: 0.3

# uncertainty scaling parameters (physics-informed)
# σ_r = √2 × (1 + a × S^b) / width
# where S = artifact strength
uncertainty:
  blur:
    a: 0.342
    b: 1.244
  noise:
    a: 0.1
    b: 1.0
  illumination:
    a: 0.1
    b: 1.0
  missing:
    a: 0.1
    b: 1.0
# hex-grid packing geometry (previously hardcoded as python defaults in
# main.py/core.py, not configurable at all). radius_ratio: circle radius as
# a fraction of image width, used only if radius_ratio_min/max are unset.
# radius_ratio_min/max: draw one radius per image from this range instead of
# a fixed radius_ratio - matches real Zenodo data, where radius is constant
# within one image but differs between images (see
# docs/task_plan_reviewed.md item 3). spacing_ratio: center-to-center
# spacing as a fraction of the max spacing that would still avoid overlap -
# must be <0.5. margin: clear border kept free of circles, in pixels.
# jitter_std: random position jitter std, in pixels. CLI flags
# (--radius-ratio/--radius-ratio-min/--radius-ratio-max/--spacing-ratio/
# --margin/--jitter) override these when passed.
generator:
  radius_ratio: 0.049
  radius_ratio_min: 0.036
  radius_ratio_max: 0.050
  spacing_ratio: 0.48
  margin: 15.0
  jitter_std: 2.0

# artifact probabilities and strengths
noise_prob: 0.3
noise_max_sigma: 10.0
salt_pepper_max_prob: 0.03

blur_prob: 0.3
blur_max_sigma: 3.0
motion_blur_max_size: 9

illumination_prob: 0.3

missing_prob: 0.3

# uncertainty scaling parameters (physics-informed, GUM-style quadrature
# combination of independent contributions; see compute_uncertainties() in
# src/utils/io_utils.py for the exact formula per artifact type)
# blur uses an exact closed form fit to real Zenodo ground truth and takes
# no config parameters; missing needs none either (no inflation, a=0).
# a/b below are in pixel-equivalents (divided by width internally, same
# convention as the 1-pixel baseline term), not fitted values.
uncertainty:
  noise:
    a: 0.5
    b: 1.0
  illumination:
    a: 10.0
    b: 1.0